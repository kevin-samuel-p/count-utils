name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]

jobs:

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build
        run: make

      - name: Package
        run: |
          mkdir package
          cp build/linux/count package/
          cp -r docs package/
          cp README.md package/ || true
          cp LICENSE package/ || true
          tar -czf counting-tool-linux-x64.tar.gz -C package .

      - name: Build .deb
        run: |
          chmod +x packaging/linux/build_deb.sh
          packaging/linux/build_deb.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: count-linux
          path: |
            counting-tool-linux-x64.tar.gz
            *.deb

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Build macOS package
        run: |
          chmod +x packaging/mac/build_pkg.sh
          packaging/mac/build_pkg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: macos-package/*.pkg

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: nmake /f Makefile.win

      - name: Package
        shell: cmd
        run: |
          mkdir package
          copy build\windows\count.exe package\
          xcopy docs package\docs /E /I
          if exist README.md copy README.md package\
          if exist LICENSE copy LICENSE package\
          powershell Compress-Archive package counting-tool-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: count-windows
          path: counting-tool-windows-x64.zip


  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            count-linux/counting-tool-linux-x64.tar.gz
            count-linux/*.deb
            macos-package/*.pkg
            count-windows/counting-tool-windows-x64.zip