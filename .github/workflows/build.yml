name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]

jobs:

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build
        run: make

      - name: Package
        run: |
          mkdir package
          cp build/linux/count package/
          cp -r docs package/
          cp README.md package/ || true
          cp LICENSE package/ || true
          tar -czf counting-tool-linux-x64.tar.gz -C package .

      - name: Build .deb
        run: |
          chmod +x packaging/linux/build-deb.sh
          packaging/linux/build-deb.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: count-linux
          path: |
            counting-tool-linux-x64.tar.gz
            *.deb

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Build macOS package
        run: |
          chmod +x packaging/mac/build_pkg.sh
          packaging/mac/build_pkg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: count-mac
          path: packaging/mac/*.pkg

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: nmake /f Makefile.win

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "packaging\windows\count.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: counting-tool-installer-windows
          path: packaging/windows/build/*.exe


  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            count-linux/counting-tool-linux-x64.tar.gz
            count-linux/*.deb
            count-mac/*.pkg
            counting-tool-installer-windows/*.exe